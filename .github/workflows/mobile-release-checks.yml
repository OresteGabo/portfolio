name: Mobile release checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ios:
        description: Also build the unsigned iOS device Release app
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Parser and release-package regression tests
        run: |
          node --version
          node --test tests/*.test.mjs
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Tests, full release lint, unsigned release bundle
        run: ./gradlew --no-daemon :core:jvmTest :app:shared:testAndroidHostTest :app:androidApp:lintRelease :app:androidApp:bundleRelease
      - name: Keep unsigned artifact and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unsigned-release-${{ github.sha }}
          retention-days: 7
          path: |
            app/androidApp/build/outputs/bundle/release/*.aab
            app/androidApp/build/reports/lint-results-release.*
            app/shared/build/reports/tests/
            core/build/reports/tests/

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build device Release without signing or publishing
        run: |
          xcodebuild -version
          xcodebuild -project app/iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/struct-ios" CODE_SIGNING_ALLOWED=NO build
          python3 scripts/check-ios-release.py "$RUNNER_TEMP/struct-ios/Build/Products/Release-iphoneos/Portfolio.app"
